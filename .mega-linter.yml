---
# MegaLinter configuration
# https://megalinter.io/latest/configuration/

# Allow zizmor's online audits (e.g. impostor-commit) to authenticate with the
# GitHub API. MegaLinter strips the environment passed to linters by default,
# which left zizmor unauthenticated and failing impostor-commit with HTTP 401.
# https://megalinter.io/latest/descriptors/action_zizmor/
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# The findings store is generated by the nitpicker findings tool, which rewrites
# INDEX.md on every change, so its tables are not hand-aligned. Same exclusion
# as .markdownlintignore.
# https://megalinter.io/latest/descriptors/markdown_markdown_table_formatter/
MARKDOWN_MARKDOWN_TABLE_FORMATTER_FILTER_REGEX_EXCLUDE: docs/audit/
